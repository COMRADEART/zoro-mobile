apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.gemininano'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.gemininano"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    // ML Kit GenAI (Gemini Nano via AICore) requires API 26+.
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
}

dependencies {
  // On-device Gemini Nano via the ML Kit GenAI Prompt API. Inference is
  // fully local (no network, no API key). Coordinate + surface verified
  // from Google docs (May 2026); summarization is done via a prompt
  // instruction rather than the separate genai-summarization artifact,
  // whose Kotlin API was not verified here. Bump deliberately and
  // re-test on a real AICore device.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
